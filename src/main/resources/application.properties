spring.application.name=sistema-academia
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aerogym}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

aerogym.cors.allowed-origins=${AEROGYM_CORS_ALLOWED_ORIGINS:http://localhost:5173}

aerogym.bootstrap.admin.login=${BOOTSTRAP_ADMIN_LOGIN:admin@aerogym.local}
aerogym.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:SenhaSuperForte}
aerogym.bootstrap.admin.cpf=${BOOTSTRAP_ADMIN_CPF:00000000000}
